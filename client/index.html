<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pinch-zoom is deliberately left enabled (no maximum-scale) so students
         can zoom into photos of handwritten work and marked answers. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="On Point Education Centre - Homework & Learning Portal. Teachers create assignments, students submit work, and receive feedback. Quality Beyond Measure." />
    <meta name="keywords" content="education, homework, learning, assignments, students, teachers" />
    <meta property="og:title" content="On Point Education Centre - Homework Portal" />
    <meta property="og:description" content="Empowering teachers and students with seamless assignment management and feedback." />
    <title>On Point Education Centre | Homework & Learning Portal</title>
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Installable app (PWA) settings. These are what Android reads when the
         app is installed or packaged for the Play Store. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Colour of the Android status bar while the app is open (school navy). -->
    <meta name="theme-color" content="#1F3864" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="On Point Homework" />

    <!-- iPhone/iPad home-screen support, for families using Apple devices. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" keeps the iOS status bar as its own strip. (Do not use
         black-translucent — that draws the page under the status bar, which
         would push this app's full-height pages out of alignment.) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="On Point" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts: Sora for headings, DM Sans for body, JetBrains Mono for code.
         Only the weights the app actually uses are requested - each extra weight
         is another file a student downloads on a phone data bundle.
           Sora           600 700 800   headings and display text
           DM Sans        400 500 600 700   body, labels, buttons
           JetBrains Mono 400 500 700   the three monospace spots
         No italic axes: the app has two italic uses, which the browser can
         slant itself rather than doubling the download.
         Poppins and Playfair Display were removed - Playfair was being
         downloaded in full and never used once. -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
